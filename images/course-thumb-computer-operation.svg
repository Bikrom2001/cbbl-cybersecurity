<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04201e"/>
      <stop offset="50%" stop-color="#0b3d3a"/>
      <stop offset="100%" stop-color="#125852"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b28"/>
      <stop offset="100%" stop-color="#061816"/>
    </linearGradient>
    <linearGradient id="accent-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12a46b"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid-pattern-1" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#12a46b" stroke-width="0.75" opacity="0.12"/>
    </pattern>
    <filter id="glow-1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bg-grad-1)"/>
  <rect width="600" height="340" fill="url(#grid-pattern-1)"/>

  <!-- Subtle ambient glow -->
  <circle cx="300" cy="170" r="160" fill="#12a46b" opacity="0.15" filter="url(#glow-1)"/>

  <!-- Floating UI / Decorative Badges -->
  <g opacity="0.9">
    <!-- NSDA Stamp/Badge -->
    <g transform="translate(470, 40)">
      <circle cx="30" cy="30" r="28" fill="#04201e" stroke="url(#gold-grad)" stroke-width="2"/>
      <circle cx="30" cy="30" r="24" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
      <text x="30" y="27" fill="#fbbf24" font-family="'Outfit', sans-serif" font-weight="800" font-size="9" text-anchor="middle" letter-spacing="1">NSDA</text>
      <text x="30" y="38" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="7.5" text-anchor="middle">LEVEL 3</text>
    </g>

    <!-- Floating Mini Window 1: Office Excel Grid -->
    <g transform="translate(60, 55)" opacity="0.85">
      <rect width="110" height="65" rx="8" fill="#0a2e2b" stroke="#18534d" stroke-width="1.2"/>
      <rect x="0" y="0" width="110" height="18" rx="8" fill="#0f3b37"/>
      <circle cx="12" cy="9" r="3" fill="#ef4444" opacity="0.8"/>
      <circle cx="20" cy="9" r="3" fill="#f59e0b" opacity="0.8"/>
      <circle cx="28" cy="9" r="3" fill="#10b981" opacity="0.8"/>
      <!-- Grid rows -->
      <line x1="10" y1="28" x2="100" y2="28" stroke="#12a46b" stroke-width="1" opacity="0.3"/>
      <line x1="10" y1="40" x2="100" y2="40" stroke="#12a46b" stroke-width="1" opacity="0.3"/>
      <line x1="10" y1="52" x2="100" y2="52" stroke="#12a46b" stroke-width="1" opacity="0.3"/>
      <rect x="12" y="22" width="22" height="4" rx="2" fill="#34d399"/>
      <rect x="40" y="22" width="30" height="4" rx="2" fill="#94a3b8" opacity="0.6"/>
      <rect x="75" y="22" width="20" height="4" rx="2" fill="#94a3b8" opacity="0.6"/>
      <rect x="12" y="34" width="26" height="4" rx="2" fill="#94a3b8" opacity="0.6"/>
      <rect x="44" y="34" width="36" height="4" rx="2" fill="#34d399"/>
    </g>
  </g>

  <!-- Central Element: Modern Laptop with Open Workstation -->
  <g transform="translate(180, 80)">
    <!-- Laptop Base Shadow -->
    <ellipse cx="120" cy="180" rx="140" ry="12" fill="#020e0d" opacity="0.6"/>

    <!-- Laptop Screen Outer Lid -->
    <rect x="25" y="15" width="190" height="125" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <!-- Laptop Inner Display -->
    <rect x="33" y="23" width="174" height="109" rx="4" fill="url(#screen-grad)"/>

    <!-- Screen Content: Modern OS Desktop UI -->
    <!-- Top Bar -->
    <rect x="33" y="23" width="174" height="14" fill="#0b2421"/>
    <text x="42" y="33" fill="#34d399" font-family="'Inter', sans-serif" font-weight="700" font-size="7">CBBL Digital Workstation</text>
    <rect x="180" y="27" width="18" height="6" rx="3" fill="#12a46b" opacity="0.6"/>

    <!-- Document Editor Pane -->
    <rect x="42" y="44" width="100" height="78" rx="4" fill="#041614" stroke="#12a46b" stroke-width="0.8" opacity="0.9"/>
    <!-- Document lines -->
    <rect x="50" y="52" width="50" height="5" rx="2" fill="#34d399"/>
    <rect x="50" y="62" width="84" height="3" rx="1.5" fill="#e2ece9" opacity="0.7"/>
    <rect x="50" y="69" width="76" height="3" rx="1.5" fill="#e2ece9" opacity="0.7"/>
    <rect x="50" y="76" width="60" height="3" rx="1.5" fill="#e2ece9" opacity="0.7"/>
    <rect x="50" y="86" width="40" height="4" rx="2" fill="#f59e0b" opacity="0.9"/>
    <rect x="50" y="95" width="80" height="3" rx="1.5" fill="#e2ece9" opacity="0.5"/>
    <rect x="50" y="102" width="70" height="3" rx="1.5" fill="#e2ece9" opacity="0.5"/>

    <!-- Side Tool Palette -->
    <rect x="148" y="44" width="50" height="78" rx="4" fill="#08201d"/>
    <rect x="154" y="52" width="38" height="16" rx="3" fill="#12a46b" opacity="0.3"/>
    <circle cx="162" cy="60" r="4" fill="#34d399"/>
    <rect x="154" y="74" width="38" height="16" rx="3" fill="#18534d" opacity="0.4"/>
    <rect x="154" y="96" width="38" height="18" rx="4" fill="#12a46b"/>
    <text x="173" y="108" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="7" text-anchor="middle">PASS</text>

    <!-- Laptop Keyboard Deck (Base) -->
    <polygon points="5,140 235,140 255,168 -15,168" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <polygon points="12,142 228,142 246,165 -6,165" fill="#0f172a"/>
    <!-- Trackpad -->
    <rect x="95" y="152" width="50" height="11" rx="2" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  </g>

  <!-- Bottom Track Overlay Title -->
  <rect x="0" y="270" width="600" height="70" fill="url(#bg-grad-1)" opacity="0.95"/>
  <line x1="0" y1="270" x2="600" y2="270" stroke="#12a46b" stroke-width="1.5" opacity="0.35"/>
  
  <g transform="translate(35, 296)">
    <rect x="0" y="0" width="130" height="22" rx="11" fill="#12a46b" opacity="0.2"/>
    <text x="65" y="14" fill="#34d399" font-family="'Inter', sans-serif" font-weight="700" font-size="10" text-anchor="middle" letter-spacing="0.5">NSDA STANDARD</text>
    
    <text x="145" y="16" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" letter-spacing="-0.3">Computer Operation – Level 3</text>
  </g>
</svg>
