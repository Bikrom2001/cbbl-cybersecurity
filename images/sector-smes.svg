<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="smeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shopWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="awningEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="trendArrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadowSme" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="48" fill="url(#smeGlow)"/>

  <!-- 3D Retail Storefront -->
  <g filter="url(#shadowSme)">
    <!-- Store Base Building -->
    <rect x="26" y="44" width="68" height="46" rx="8" fill="url(#shopWall)"/>

    <!-- Awning Canopy (Stripes) -->
    <path d="M22 36 L98 36 L92 50 L28 50 Z" fill="url(#awningEmerald)"/>
    <!-- Awning Scallops -->
    <circle cx="34" cy="50" r="6" fill="url(#awningEmerald)"/>
    <circle cx="46" cy="50" r="6" fill="#ffffff"/>
    <circle cx="58" cy="50" r="6" fill="url(#awningEmerald)"/>
    <circle cx="70" cy="50" r="6" fill="#ffffff"/>
    <circle cx="82" cy="50" r="6" fill="url(#awningEmerald)"/>

    <!-- Large Display Glass Window -->
    <rect x="34" y="58" width="30" height="24" rx="4" fill="#38bdf8" opacity="0.3"/>
    <rect x="34" y="58" width="30" height="24" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Store Door -->
    <rect x="70" y="58" width="16" height="32" rx="3" fill="#0f172a"/>
    <circle cx="74" cy="74" r="1.5" fill="#f59e0b"/>
  </g>

  <!-- 3D Rising Growth Arrow -->
  <g filter="url(#shadowSme)">
    <path d="M72 40 L98 22 L98 34" fill="none" stroke="url(#trendArrow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="98,20 106,22 100,28" fill="#059669"/>
  </g>

  <!-- 3D Shopping Bag -->
  <g filter="url(#shadowSme)" transform="translate(18, 62)">
    <rect x="0" y="6" width="18" height="20" rx="4" fill="url(#bagGrad)"/>
    <!-- Handle -->
    <path d="M4 6 C4 0 14 0 14 6" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
    <circle cx="9" cy="15" r="3" fill="#ffffff"/>
  </g>

  <!-- Sparkles -->
  <circle cx="104" cy="48" r="2.5" fill="#fbbf24"/>
  <circle cx="20" cy="28" r="3" fill="#10b981"/>
</svg>