<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="eduGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b3d3a"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12a46b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldTassel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadowEdu" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="58" r="48" fill="url(#eduGlow)"/>

  <!-- 3D Open Book Foundation -->
  <g filter="url(#shadowEdu)">
    <!-- Book Base Spreads -->
    <path d="M22 76 C38 68 56 70 60 76 C64 70 82 68 98 76 L94 88 C78 80 64 82 60 88 C56 82 42 80 26 88 Z" fill="url(#bookCover)"/>
    <!-- Book Pages -->
    <path d="M24 73 C38 65 56 67 60 73 C64 67 82 65 96 73 L92 84 C78 77 64 79 60 84 C56 79 42 77 28 84 Z" fill="#ffffff"/>
    <path d="M26 71 C40 64 56 65 60 71 C64 65 80 64 94 71 L91 79 C78 74 64 75 60 79 C56 75 42 74 29 79 Z" fill="#f8fafc"/>
  </g>

  <!-- 3D Mortarboard Graduation Cap -->
  <g filter="url(#shadowEdu)">
    <!-- Skull Cap Base -->
    <ellipse cx="60" cy="54" rx="20" ry="8" fill="#0b3d3a"/>
    <!-- Cap Diamond Top -->
    <polygon points="60,22 104,38 60,54 16,38" fill="url(#capGrad)"/>
    <!-- Cap Top Highlight Rim -->
    <polygon points="60,24 100,38 60,52 20,38" fill="none" stroke="#34d399" stroke-width="1" opacity="0.6"/>

    <!-- Center Button -->
    <ellipse cx="60" cy="38" rx="4" ry="2.5" fill="url(#goldTassel)"/>

    <!-- Golden Tassel Hanging Down -->
    <path d="M60 38 Q82 42 86 58" fill="none" stroke="url(#goldTassel)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tassel Fringe -->
    <rect x="83" y="58" width="6" height="10" rx="2" fill="url(#goldTassel)"/>
  </g>

  <!-- Floating Certificate Scroll -->
  <g filter="url(#shadowEdu)" transform="translate(14, 52) rotate(-18)">
    <rect x="0" y="0" width="22" height="14" rx="3" fill="#fef9c3"/>
    <rect x="9" y="0" width="4" height="14" fill="#ef4444"/>
  </g>

  <!-- Sparkles -->
  <circle cx="102" cy="24" r="2.5" fill="#f59e0b"/>
  <circle cx="18" cy="28" r="3" fill="#10b981"/>
</svg>