<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="healthGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldHealth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="crossRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="stethoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadowHealth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#991b1b" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="48" fill="url(#healthGlow)"/>

  <!-- 3D Heart Protection Shield Foundation -->
  <g filter="url(#shadowHealth)">
    <!-- Base Shield -->
    <path d="M60 22 C82 22 96 30 96 48 C96 74 60 96 60 96 C60 96 24 74 24 48 C24 30 38 22 60 22 Z" fill="url(#shieldHealth)"/>
    <path d="M60 25 C80 25 93 32 93 48 C93 72 60 92 60 92 C60 92 27 72 27 48 C27 32 40 25 60 25 Z" fill="none" stroke="#e2e8f0" stroke-width="2"/>

    <!-- 3D Vibrant Medical Cross -->
    <rect x="48" y="36" width="24" height="42" rx="6" fill="url(#crossRed)"/>
    <rect x="39" y="45" width="42" height="24" rx="6" fill="url(#crossRed)"/>

    <!-- Heartbeat Pulse Line Inside Cross -->
    <path d="M42 57 L49 57 L53 47 L58 66 L63 52 L67 59 L78 59" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 3D Stethoscope Wrap -->
  <g filter="url(#shadowHealth)">
    <path d="M30 42 C20 54 22 76 38 84 C48 89 54 88 56 86" fill="none" stroke="url(#stethoGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Stethoscope Sensor Bell -->
    <circle cx="28" cy="38" r="7" fill="#64748b"/>
    <circle cx="28" cy="38" r="4.5" fill="#0284c7"/>
  </g>

  <!-- Sparkles -->
  <circle cx="94" cy="32" r="3" fill="#38bdf8"/>
  <circle cx="22" cy="68" r="2.5" fill="#f87171"/>
</svg>