<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-hack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020b14"/>
      <stop offset="45%" stop-color="#081b2e"/>
      <stop offset="100%" stop-color="#0f2b48"/>
    </linearGradient>
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="cyber-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="terminal-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="hex-grid" width="30" height="52" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M15 0 L30 8.66 L30 26 L15 34.64 L0 26 L0 8.66 Z M0 43.3 L15 51.96 L30 43.3" fill="none" stroke="#00f2fe" stroke-width="0.75" opacity="0.08"/>
    </pattern>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bg-hack)"/>
  <rect width="600" height="340" fill="url(#hex-grid)"/>

  <!-- Radial glowing core -->
  <circle cx="300" cy="155" r="140" fill="#00f2fe" opacity="0.12" filter="url(#glow-cyan)"/>
  <circle cx="430" cy="110" r="90" fill="#10b981" opacity="0.08" filter="url(#glow-cyan)"/>

  <!-- Network Topology Nodes in Background -->
  <g opacity="0.4" stroke="#00f2fe" stroke-width="1.2">
    <line x1="80" y1="90" x2="150" y2="140"/>
    <line x1="150" y1="140" x2="110" y2="210"/>
    <line x1="450" y1="80" x2="520" y2="120"/>
    <line x1="520" y1="120" x2="480" y2="190"/>
    <line x1="480" y1="190" x2="540" y2="230"/>
    <circle cx="80" cy="90" r="4" fill="#00f2fe"/>
    <circle cx="150" cy="140" r="5" fill="#4facfe"/>
    <circle cx="110" cy="210" r="4" fill="#10b981"/>
    <circle cx="450" cy="80" r="4" fill="#00f2fe"/>
    <circle cx="520" cy="120" r="6" fill="#10b981"/>
    <circle cx="480" cy="190" r="5" fill="#00f2fe"/>
    <circle cx="540" cy="230" r="4" fill="#4facfe"/>
  </g>

  <!-- Left: Glowing Cyber Shield -->
  <g transform="translate(70, 75)">
    <!-- Outer Shield Glow -->
    <path d="M 50 10 Q 75 12 90 25 Q 90 85 50 120 Q 10 85 10 25 Q 25 12 50 10 Z" fill="#00f2fe" opacity="0.1" filter="url(#glow-cyan)"/>
    <!-- Main Shield -->
    <path d="M 50 15 Q 72 17 84 28 Q 84 80 50 110 Q 16 80 16 28 Q 28 17 50 15 Z" fill="#0a192f" stroke="url(#cyber-cyan)" stroke-width="2"/>
    <path d="M 50 24 Q 66 26 75 35 Q 75 74 50 98 Q 25 74 25 35 Q 34 26 50 24 Z" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4 2"/>
    
    <!-- Central Keyhole/Lock Icon -->
    <circle cx="50" cy="55" r="9" fill="#00f2fe"/>
    <polygon points="46,57 54,57 56,74 44,74" fill="#00f2fe"/>
  </g>

  <!-- Center/Right: Interactive Kali Linux Terminal Window -->
  <g transform="translate(195, 45)">
    <!-- Shadow -->
    <rect x="-8" y="5" width="350" height="205" rx="12" fill="#01060c" opacity="0.7"/>

    <!-- Window Frame -->
    <rect x="0" y="0" width="340" height="195" rx="10" fill="#07111e" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Top Bar -->
    <rect x="0" y="0" width="340" height="28" rx="10" fill="url(#terminal-bar)"/>
    <circle cx="15" cy="14" r="4" fill="#ef4444"/>
    <circle cx="27" cy="14" r="4" fill="#f59e0b"/>
    <circle cx="39" cy="14" r="4" fill="#10b981"/>
    <text x="170" y="18" fill="#94a3b8" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" text-anchor="middle" font-weight="600">kali@cbbl-lab:~# ./vapt_scan.sh</text>

    <!-- Terminal Code / Output -->
    <g transform="translate(15, 45)" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9.5">
      <!-- Line 1 -->
      <text x="0" y="0" fill="#10b981" font-weight="700">kali@cbbl:~$</text>
      <text x="75" y="0" fill="#ffffff">nmap -sV -sC -T4 target.lab</text>
      
      <!-- Line 2 -->
      <text x="0" y="18" fill="#4facfe">[+] Starting Nmap 7.94 scan on 192.168.10.45</text>
      
      <!-- Line 3 -->
      <text x="0" y="36" fill="#94a3b8">PORT     STATE SERVICE       VERSION</text>
      <text x="0" y="52" fill="#e2e8f0"><tspan fill="#38bdf8">80/tcp  </tspan> <tspan fill="#34d399">open </tspan> http          Apache httpd 2.4.52</text>
      <text x="0" y="68" fill="#e2e8f0"><tspan fill="#38bdf8">443/tcp </tspan> <tspan fill="#34d399">open </tspan> ssl/http      OpenSSL 3.0.2</text>
      <text x="0" y="84" fill="#e2e8f0"><tspan fill="#38bdf8">8080/tcp</tspan> <tspan fill="#f59e0b">open </tspan> http-proxy    Burp Suite Ingest</text>

      <!-- Status badge box inside terminal -->
      <g transform="translate(0, 100)">
        <rect width="310" height="26" rx="4" fill="#0d2847" stroke="#00f2fe" stroke-width="0.8"/>
        <circle cx="12" cy="13" r="4" fill="#00f2fe"/>
        <text x="24" y="16" fill="#00f2fe" font-weight="700" font-size="9">TARGET VULNERABILITY AUDIT: AUTHORISED LAB</text>
      </g>
    </g>
  </g>

  <!-- Bottom Track Overlay Title -->
  <rect x="0" y="270" width="600" height="70" fill="url(#bg-hack)" opacity="0.95"/>
  <line x1="0" y1="270" x2="600" y2="270" stroke="#00f2fe" stroke-width="1.5" opacity="0.4"/>
  
  <g transform="translate(35, 296)">
    <rect x="0" y="0" width="130" height="22" rx="11" fill="#00f2fe" opacity="0.2"/>
    <text x="65" y="14" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="700" font-size="10" text-anchor="middle" letter-spacing="0.5">RED TEAM TRACK</text>
    
    <text x="145" y="16" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" letter-spacing="-0.3">Ethical Hacking Fundamentals</text>
  </g>
</svg>
