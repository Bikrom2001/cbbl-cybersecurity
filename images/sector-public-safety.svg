<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="safetyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cyanCyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadowSafety" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="48" fill="url(#safetyGlow)"/>

  <!-- 3D Heavy Shield Frame -->
  <g filter="url(#shadowSafety)">
    <!-- Outer Shield with Gold Edge -->
    <path d="M60 18 C86 20 98 26 98 48 C98 76 60 98 60 98 C60 98 22 76 22 48 C22 26 34 20 60 18 Z" fill="url(#goldRim)"/>
    <!-- Inner Dark Metallic Plate -->
    <path d="M60 22 C82 24 93 29 93 48 C93 72 60 92 60 92 C60 92 27 72 27 48 C27 29 38 24 60 22 Z" fill="url(#shieldMetallic)"/>

    <!-- Cyber Shield Radar / Grid Rings -->
    <circle cx="60" cy="56" r="22" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
    <circle cx="60" cy="56" r="14" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>

    <!-- Central 3D High-Security Star Emblem -->
    <polygon points="60,38 64,50 76,50 66,57 70,69 60,62 50,69 54,57 44,50 56,50" fill="url(#goldRim)"/>

    <!-- Cyber Keyhole in Center -->
    <circle cx="60" cy="54" r="3" fill="#0f172a"/>
    <polygon points="58,54 62,54 63,61 57,61" fill="#0f172a"/>
  </g>

  <!-- Floating Digital Node Rings -->
  <circle cx="16" cy="46" r="3" fill="#38bdf8"/>
  <circle cx="104" cy="46" r="3" fill="#facc15"/>
  <path d="M16 46 Q24 60 30 72" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
</svg>