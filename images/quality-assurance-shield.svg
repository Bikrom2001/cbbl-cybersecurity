<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="qualityGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Gold Ribbon & Ring -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- 3D Emerald Shield Body -->
    <linearGradient id="shieldEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Shield Inner Core Plate -->
    <linearGradient id="shieldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b3d3a"/>
    </linearGradient>

    <!-- Metallic Edge Highlight -->
    <linearGradient id="silverHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>

    <!-- 3D Drop Shadows -->
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="8" stdDeviation="7" flood-color="#064e3b" flood-opacity="0.3"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="120" cy="115" r="95" fill="url(#qualityGlow)"/>

  <!-- Orbital Cyber Rings -->
  <ellipse cx="120" cy="115" rx="102" ry="48" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.35" transform="rotate(-15, 120, 115)"/>
  <circle cx="210" cy="95" r="4" fill="#34d399"/>
  <circle cx="32" cy="135" r="3" fill="#fbbf24"/>

  <!-- Main 3D Shield -->
  <g filter="url(#shieldShadow)">
    <!-- Outer Golden Trim Border -->
    <path d="M120 32 C168 35 190 46 190 88 C190 144 120 186 120 186 C120 186 50 144 50 88 C50 46 72 35 120 32 Z" fill="url(#goldGradient)"/>

    <!-- Inner Emerald Bezel -->
    <path d="M120 38 C162 41 182 50 182 90 C182 140 120 178 120 178 C120 178 58 140 58 90 C58 50 78 41 120 38 Z" fill="url(#shieldEmerald)"/>

    <!-- Dark High-Tech Center Plate -->
    <path d="M120 45 C155 48 172 56 172 92 C172 134 120 168 120 168 C120 168 68 134 68 92 C68 56 85 48 120 45 Z" fill="url(#shieldPlate)"/>

    <!-- Subtle Tech Circuit Lines on Shield Plate -->
    <path d="M120 52 V90" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>
    <path d="M90 92 H150" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>
    <circle cx="120" cy="92" r="32" fill="none" stroke="#34d399" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Central 3D Golden Quality Seal & Sunburst Checkmark -->
  <g filter="url(#goldGlow)">
    <!-- Outer Starburst Rosette Ring -->
    <circle cx="120" cy="108" r="34" fill="url(#goldGradient)"/>
    <!-- Inner Rosette Plate -->
    <circle cx="120" cy="108" r="28" fill="#ffffff"/>
    <circle cx="120" cy="108" r="25" fill="url(#shieldEmerald)"/>

    <!-- Heavy 3D Checkmark -->
    <path d="M107 108 L116 117 L134 98" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Golden Quality Ribbon Tails (Hanging below the seal) -->
  <g filter="url(#goldGlow)">
    <!-- Left Ribbon Tail -->
    <path d="M102 135 L90 196 L104 186 L118 196 L112 138 Z" fill="url(#goldGradient)"/>
    <!-- Right Ribbon Tail -->
    <path d="M138 135 L150 196 L136 186 L122 196 L128 138 Z" fill="url(#goldGradient)"/>
    <!-- Ribbon Gold Edge Shadows -->
    <path d="M90 196 L104 186 L118 196" fill="none" stroke="#b45309" stroke-width="1.5"/>
    <path d="M150 196 L136 186 L122 196" fill="none" stroke="#b45309" stroke-width="1.5"/>
  </g>

  <!-- Floating 3D Verified Badge / Stars -->
  <g filter="url(#goldGlow)">
    <!-- Star 1 (Top Left) -->
    <polygon points="56,42 59,50 67,50 61,55 63,63 56,58 49,63 51,55 45,50 53,50" fill="url(#goldGradient)"/>
    <!-- Star 2 (Top Right) -->
    <polygon points="184,42 187,50 195,50 189,55 191,63 184,58 177,63 179,55 173,50 181,50" fill="url(#goldGradient)"/>
  </g>

  <!-- Sparkles -->
  <path d="M120 14 L122 19 L127 21 L122 23 L120 28 L118 23 L113 21 L118 19 Z" fill="#fbbf24"/>
  <circle cx="198" cy="148" r="3.5" fill="#34d399"/>
  <circle cx="44" cy="98" r="2.5" fill="#fef08a"/>
</svg>